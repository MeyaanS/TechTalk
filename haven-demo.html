<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haven (hackathon demo)</title>
<style>
:root{--ink:#12262B;--pine:#1D5C57;--pine2:#14433F;--mist:#EDF2F1;--line:#C5D3D0;--paper:#FBFDFC;--focus:#1A4FD6}
*{box-sizing:border-box}
body{margin:0;font:1.05rem/1.6 "Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--paper);min-height:100vh;display:flex;flex-direction:column}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:4px}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:#fff;padding:10px;z-index:9}
header{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;padding:12px 20px;background:#fff;border-bottom:2px solid var(--line)}
header b{font-size:1.5rem;color:var(--pine)}
nav{display:flex;flex-wrap:wrap;gap:6px 16px}
nav button{background:none;border:0;font:inherit;font-weight:700;color:var(--pine);text-decoration:underline;text-underline-offset:4px;cursor:pointer;min-height:44px}
nav button[aria-current=page]{color:var(--ink);text-decoration:none;border-bottom:3px solid var(--pine)}
main{flex:1;width:100%;max-width:860px;margin:0 auto;padding:24px 20px}
footer{background:var(--mist);border-top:2px solid var(--line);padding:16px 20px;text-align:center}
h1{font-size:2rem;line-height:1.2;margin:.2em 0 .5em}h2{font-size:1.3rem;margin:1.4em 0 .4em}
.btn{min-height:48px;padding:0 22px;border:2px solid var(--pine);border-radius:10px;font:inherit;font-weight:700;font-size:1.1rem;cursor:pointer;background:#fff;color:var(--pine)}
.btn.p{background:var(--pine);color:#fff}.btn:hover{background:var(--mist)}.btn.p:hover{background:var(--pine2)}
.row{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
input,select{min-height:48px;width:100%;font:inherit;padding:0 12px;border:2px solid #4a5d61;border-radius:10px;background:#fff}
label{font-weight:700;display:block;margin:12px 0 4px}
.card{border:2px solid var(--line);border-radius:12px;padding:16px;background:#fff;margin:12px 0}
.note{background:var(--mist);border:2px solid var(--line);border-radius:10px;padding:12px;margin:12px 0}
.stage{border-radius:12px;padding:18px;margin:12px 0;border:3px solid}
.s0{background:#E7F3EE;border-color:var(--pine)}
.s1{background:#FFF4D6;border-color:#8A5A00}
.s2{background:#FDE3E3;border-color:#8E1B1B}
.s3{background:#5B0F0F;border-color:#2B0000;color:#fff}
.stage h2{margin:0 0 6px;font-size:1.6rem}
.top li{font-size:1.25rem;font-weight:700;margin:10px 0}
pre{white-space:pre-wrap;font:inherit;background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:10px;max-height:240px;overflow:auto}
.chk{display:flex;gap:12px;align-items:flex-start;min-height:44px;margin:6px 0;font-weight:400}
.chk input{width:24px;height:24px;min-height:0;margin-top:3px;flex:none}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pine)}
#c{height:300px;border:2px solid var(--line);border-radius:12px;background:#f3f7f6;touch-action:manipulation}
.zone{border-left:6px solid var(--line)}.zone.sel{border-left-color:var(--pine);background:var(--mist)}
.sim button{min-height:44px;margin:4px 4px 0 0}.sim [aria-pressed=true]{background:var(--pine);color:#fff}
.arrow{display:inline-block;font-size:2.4rem;line-height:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<header><b>Haven</b><nav id="nav" aria-label="Main"></nav></header>
<main id="main" tabindex="-1"></main>
<footer>Haven is a planning aid, not an official emergency service. In an emergency, call 911.</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ---------- tiny helpers & saved state ---------- */
const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S; try { S = JSON.parse(localStorage.getItem('haven')) || {}; } catch { S = {}; }
S.view ||= 'login'; S.p ||= {zip:'', type:'single_family', pets:0, elderly:0, mob:false, veh:1};
S.done ||= {}; S.bag ||= {};
const save = () => { try { localStorage.setItem('haven', JSON.stringify(S)); } catch {} };
let live = {status:'idle'}, sim = null, view3d = true, renderer, scene, cam, meshes = [];

/* ---------- live data: ZIP -> lat/lon -> National Weather Service ---------- */
async function loadLive() {
  live = {status:'loading'}; render();
  try {
    if (!S.loc) {
      const z = await fetch('https://api.zippopotam.us/us/' + encodeURIComponent(S.p.zip));
      if (!z.ok) throw new Error('zip');
      const pl = (await z.json()).places[0];
      S.loc = {lat:+pl.latitude, lon:+pl.longitude, name:pl['place name'] + ', ' + pl['state abbreviation']};
    }
    const {lat, lon} = S.loc, q = lat.toFixed(4) + ',' + lon.toFixed(4), H = {headers:{Accept:'application/geo+json'}};
    const pt = await fetch('https://api.weather.gov/points/' + q, H);
    if (pt.status === 404) { live = {status:'outside'}; save(); return render(); }
    const grid = (await pt.json()).properties.forecastGridData;
    const [al, gr] = await Promise.all([
      fetch('https://api.weather.gov/alerts/active?point=' + q, H).then(r => r.json()),
      fetch(grid, H).then(r => r.json())]);
    live = {status:'ok', at:new Date(), alerts:al.features.map(f => f.properties), grid:gr.properties};
  } catch (e) { live = {status:'error'}; }
  save(); render();
}
const val = k => live.grid?.[k]?.values?.[0]?.value;
const mph = v => v == null ? 'n/a' : Math.round(v * 0.621371) + ' mph';
function realStage() {
  if (live.status !== 'ok') return 0;
  let s = 0;
  for (const a of live.alerts) {
    const e = a.event || '';
    if (/evacuation/i.test(e)) s = Math.max(s, 3);
    else if (/red flag/i.test(e)) s = Math.max(s, 2);
    else if (/fire weather watch/i.test(e)) s = Math.max(s, 1);
  }
  return s;
}

/* ---------- content ---------- */
const STAGE = [
  {n:'No alert', icon:'✔', msg:'No fire weather watch or warning for your area right now.'},
  {n:'Stage 1: Fire Weather Watch', icon:'⚠', msg:'Fire weather conditions may develop. Use this time to get ready.'},
  {n:'Stage 2: Red Flag Warning', icon:'⚠⚠', msg:'Dangerous fire weather is happening or about to happen.'},
  {n:'Stage 3: Evacuation', icon:'⛔', msg:'Officials have told people in your area to leave.'}];
function actions(st) {
  const p = S.p;
  const top = {
    1:['Charge phones and power banks.','Check your go-bag and fill your gas tank.','Pick two ways out of your area.'],
    2:['Close all home vents and windows.','Park vehicles facing outward for a quick exit.','Charge backup power banks.'],
    3:['Leave now. Follow instructions from local officials.','Take your go-bag, medications, and documents.','Do not go back for belongings.']}[st];
  const more = [];
  if (+p.pets > 0) more.push('Put pet carriers, leashes, and food by the door.');
  if (+p.elderly > 0) more.push('Check on older family members and their medications.');
  if (p.mob) more.push('Line up help to leave early. Do not wait.');
  if (+p.veh < 1) more.push('Arrange a ride now. Ask a neighbor or call your county emergency office.');
  return {top, more};
}
const TASKS = {0:['Clear gutters of dry leaves','Move firewood away from exterior walls','Replace bark mulch with gravel'],
  1:['Trim low tree branches','Mow grass below 4 inches'],
  2:['Space tree canopies so fire cannot jump between them']};
const EXTRA = {single_family:{0:['Cover attic and crawl-space vents with fine metal mesh']},
  rural_acreage:{1:['Keep a hose or water source you can reach'],2:['Thin dense brush on slopes']},
  suburban_townhome:{0:['Clear balconies and decks of stored items']}};
const ZN = ['Zone 0: 0 to 5 ft, non-combustible','Zone 1: 5 to 30 ft, clean and green','Zone 2: 30 to 100 ft, reduced fuel'];
const tasksFor = z => [...TASKS[z], ...(EXTRA[S.p.type]?.[z] || [])];
const prog = z => { const t = tasksFor(z); const d = t.filter(x => S.done[z + ':' + x]).length; return {d, n:t.length, pct:Math.round(100 * d / t.length)}; };
function bagItems() {
  const p = S.p, b = ['ID and copies of important documents','3-day supply of medications','Phone chargers and power banks','Water and food for 3 days','Flashlight and batteries','Cash and a paper map'];
  if (+p.pets > 0) b.push('Pet food, water, leash, and carrier');
  if (+p.elderly > 0) b.push('Medical info, glasses, and hearing aids for older family members');
  if (p.mob) b.push('Mobility aids and spare supplies');
  return b;
}

/* ---------- views ---------- */
const V = {};
V.login = () => `
  <h1>Get your home and household ready for fire season.</h1>
  <p>Haven turns official fire-weather alerts into clear steps for you. No password. No phone number.</p>
  <div class="row">
    <form id="lf" class="card"><h2 style="margin-top:0">Save your progress</h2>
      <label for="em">Email address</label><input id="em" type="email" autocomplete="email" required>
      <p><button class="btn p" style="width:100%">Email me a sign-in link</button></p>
      <p class="note">Demo: no email is sent. The full app uses secure magic links.</p></form>
    <div class="card"><h2 style="margin-top:0">Just look around</h2>
      <p>Use every feature as a guest. Create an account later.</p>
      <p><button class="btn" id="skip" style="width:100%">Skip for now</button></p></div>
  </div>`;
V.setup = () => { const p = S.p; return `
  <h1>Your household</h1>
  <form id="sf" class="card">
    <label for="zip">ZIP code (US only)</label><input id="zip" inputmode="numeric" pattern="[0-9]{5}" required value="${esc(p.zip)}">
    <label for="ty">Property type</label><select id="ty">
      ${[['single_family','Single-family home'],['rural_acreage','Rural acreage'],['suburban_townhome','Suburban townhome']].map(([v,t]) => `<option value="${v}" ${p.type===v?'selected':''}>${t}</option>`).join('')}</select>
    <div class="row"><div><label for="pe">Pets</label><input id="pe" type="number" min="0" value="${p.pets}"></div>
    <div><label for="el">Older members</label><input id="el" type="number" min="0" value="${p.elderly}"></div>
    <div><label for="ve">Vehicles</label><input id="ve" type="number" min="0" value="${p.veh}"></div></div>
    <label class="chk"><input id="mo" type="checkbox" ${p.mob?'checked':''}> Someone needs mobility help</label>
    <p><button class="btn p">Save and check my area</button></p>
  </form>`; };
V.home = () => {
  const real = realStage(), st = sim ?? real, A = st ? actions(st) : null, s = STAGE[st];
  const wd = val('windDirection');
  const cond = live.status === 'ok' ? `<div class="card"><h2 style="margin-top:0">Conditions near ${esc(S.loc?.name)}</h2>
    <p>Humidity: <b>${val('relativeHumidity') ?? 'n/a'}%</b> &nbsp; Wind: <b>${mph(val('windSpeed'))}</b> &nbsp; Gusts: <b>${mph(val('windGust'))}</b>
    ${wd != null ? `&nbsp; Wind from <b>${Math.round(wd)}°</b> <span class="arrow" aria-hidden="true" style="transform:rotate(${wd+180}deg)">↑</span>` : ''}</p>
    <p class="note">Source: National Weather Service forecast grid data (api.weather.gov), fetched ${live.at.toLocaleTimeString()}. This is a forecast, not a warning.</p></div>` : '';
  const alerts = live.status === 'ok' ? live.alerts.filter(a => /fire|red flag|evacuation/i.test(a.event || '')) : [];
  const alertHtml = alerts.map(a => `<div class="card"><b>${esc(a.event)}</b> (${esc(a.severity)})
    <p>Issued ${new Date(a.sent).toLocaleString()} · Expires ${a.expires ? new Date(a.expires).toLocaleString() : 'n/a'}<br>Source: ${esc(a.senderName)} via api.weather.gov</p>
    <pre>${esc(a.headline ? a.headline + '\n\n' : '')}${esc(a.description)}\n\n${esc(a.instruction || '')}</pre></div>`).join('');
  const status = live.status === 'loading' ? 'Checking official sources…'
    : live.status === 'outside' ? 'Haven covers the United States only for now.'
    : live.status === 'error' ? 'Data unavailable. We could not reach the weather service or find that ZIP code. This does NOT mean you are safe.'
    : live.status === 'idle' ? 'Enter your ZIP code in Setup to check your area.' : s.msg;
  const demo = `<div class="note sim" role="group" aria-label="Demo controls"><b>Demo controls</b> (for presenting only)<br>
    ${[['Live data',null],['Simulate Watch',1],['Simulate Warning',2],['Simulate Evacuation',3]].map(([t,v]) => `<button class="btn" data-sim="${v}" aria-pressed="${sim === v}">${t}</button>`).join('')}</div>`;
  const banner = `<div class="stage s${st}" role="status" aria-live="polite"><h2><span aria-hidden="true">${s.icon}</span> ${esc(s.n)}</h2>
    <p style="margin:0">${esc(status)}</p>${sim ? '<p><b>SIMULATED FOR DEMO. This is not a real alert.</b></p>' : ''}</div>`;
  if (st) return `<h1>High Alert Mode</h1>${banner}
    <h2>Do these 3 things first</h2><ol class="top">${A.top.map(t => `<li>${esc(t)}</li>`).join('')}</ol>
    ${A.more.length ? `<h2>For your household</h2><ul>${A.more.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}
    <details><summary><b>Official alert text and conditions</b></summary>${sim ? '<p>No real alert text in simulation.</p>' : alertHtml}${cond}</details>${demo}`;
  const all = [0,1,2].map(prog);
  return `<h1>Home</h1>${banner}${cond}${alertHtml}
    <div class="card"><h2 style="margin-top:0">Your preparation</h2>${all.map((p,i) => `<p style="margin:.4em 0">Zone ${i}: ${p.d} of ${p.n} done</p><div class="bar" role="img" aria-label="Zone ${i} ${p.pct} percent"><i style="width:${p.pct}%"></i></div>`).join('')}
    <p><button class="btn p" data-go="zones">Open zone checklist</button></p></div>${demo}`;
};
V.zones = () => `
  <h1>Defensive zone checklist</h1>
  <p><button class="btn" id="tg">${view3d ? 'Switch to list view' : 'Switch to 3D view'}</button></p>
  ${view3d && window.THREE ? `<div id="c" role="img" aria-label="3D home diagram with three zones. Tap a zone, or use the list below."></div><p class="note">Tap a ring to open its tasks. Darker green means more tasks done.</p>` : ''}
  ${[0,1,2].map(z => { const p = prog(z); return `<section class="card zone ${S.zone === z ? 'sel' : ''}" id="z${z}" aria-labelledby="zh${z}"><h2 id="zh${z}" style="margin-top:0">${ZN[z]}</h2>
    <p>${p.d} of ${p.n} done (${p.pct}%)</p><div class="bar"><i style="width:${p.pct}%"></i></div>
    ${tasksFor(z).map(t => `<label class="chk"><input type="checkbox" data-task="${esc(z + ':' + t)}" ${S.done[z + ':' + t] ? 'checked' : ''}> <span>${esc(t)}</span></label>`).join('')}</section>`; }).join('')}`;
V.bag = () => `<h1>Go-bag</h1><p>Built from your household profile.</p><div class="card">
  ${bagItems().map(t => `<label class="chk"><input type="checkbox" data-bag="${esc(t)}" ${S.bag[t] ? 'checked' : ''}> <span>${esc(t)}</span></label>`).join('')}</div>`;
V.route = () => { const wd = val('windDirection'); return `<h1>Evacuation</h1>
  <div class="card"><h2 style="margin-top:0">Official routes</h2>
    <p>This demo is not connected to a county or state evacuation feed, so it shows none. Never invent one. Check your county emergency management website.</p></div>
  <div class="card"><h2 style="margin-top:0">Suggested routes</h2>
    <p>The full app creates routes labeled <b>"Suggested route, not official"</b> only when no official route exists and live fire-perimeter data is available.</p>
    <p class="note"><b>This route is a suggestion generated by Haven and is NOT an official evacuation route.</b> Conditions change quickly. Follow instructions from local authorities and emergency officials, and use any official route when one is announced.</p></div>
  <div class="card"><h2 style="margin-top:0">Live wind</h2>${wd != null ? `<p><span class="arrow" aria-hidden="true" style="transform:rotate(${wd+180}deg)">↑</span> Wind from ${Math.round(wd)}° at ${mph(val('windSpeed'))} (NWS, ${live.at.toLocaleTimeString()})</p>` : '<p>Data unavailable. Check your area on the Setup page.</p>'}</div>`; };

/* ---------- 3D diagram (simple geometry, drawn only when something changes) ---------- */
function draw3d() {
  const el = $('#c'); if (!el || !window.THREE) return;
  const w = el.clientWidth, h = el.clientHeight;
  renderer = new THREE.WebGLRenderer({antialias:true, alpha:true}); renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(w, h);
  el.appendChild(renderer.domElement);
  scene = new THREE.Scene(); cam = new THREE.PerspectiveCamera(40, w / h, .1, 100); cam.position.set(0, 8, 9); cam.lookAt(0, 0, 0);
  scene.add(new THREE.AmbientLight(0xffffff, .8)); const dl = new THREE.DirectionalLight(0xffffff, .6); dl.position.set(3, 8, 4); scene.add(dl);
  meshes = [];
  [[4.2, 2], [2.8, 1], [1.6, 0]].forEach(([r, z], i) => {
    const t = prog(z).pct / 100, col = new THREE.Color('#d5ddd9').lerp(new THREE.Color('#1D7A5F'), t);
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, .15, 40), new THREE.MeshLambertMaterial({color:col}));
    m.position.y = i * .16; m.userData.z = z; scene.add(m); meshes.push(m);
    if (S.zone === z) { const ring = new THREE.Mesh(new THREE.TorusGeometry(r, .06, 8, 48), new THREE.MeshBasicMaterial({color:0x12262B})); ring.rotation.x = Math.PI / 2; ring.position.y = i * .16 + .1; scene.add(ring); }
  });
  const house = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1, 1.2), new THREE.MeshLambertMaterial({color:0xf2efe8})); house.position.y = .85; scene.add(house);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(1.3, .8, 4), new THREE.MeshLambertMaterial({color:0x4b5d63})); roof.position.y = 1.75; roof.rotation.y = Math.PI / 4; scene.add(roof);
  renderer.render(scene, cam);
  const ray = new THREE.Raycaster();
  renderer.domElement.addEventListener('pointerdown', e => {
    const r = renderer.domElement.getBoundingClientRect();
    ray.setFromCamera({x:((e.clientX - r.left) / r.width) * 2 - 1, y:-((e.clientY - r.top) / r.height) * 2 + 1}, cam);
    const hit = ray.intersectObjects(meshes)[0]; if (!hit) return;
    S.zone = hit.object.userData.z; save(); render(); $('#z' + S.zone)?.scrollIntoView({block:'center'});
  });
}

/* ---------- render + events ---------- */
const NAV = [['home','Home'],['zones','Checklist'],['bag','Go-bag'],['route','Evacuation'],['setup','Setup']];
function go(v) { S.view = v; save(); render(); $('#main').focus(); }
function render() {
  if (renderer) { renderer.dispose(); renderer = null; }
  $('#nav').innerHTML = S.view === 'login' ? '' : NAV.map(([v, t]) => `<button data-go="${v}" ${S.view === v ? 'aria-current="page"' : ''}>${t}</button>`).join('') +
    `<button id="out">${S.user ? 'Log out' : 'Create account'}</button>`;
  $('#main').innerHTML = V[S.view]();
  if (S.view === 'zones') draw3d();
}
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.go) go(t.dataset.go);
  else if (t.id === 'skip') { S.user = null; go('setup'); }
  else if (t.id === 'out') { S.user ? (S.user = null) : null; go('login'); }
  else if (t.id === 'tg') { view3d = !view3d; render(); }
  else if ('sim' in t.dataset) { sim = t.dataset.sim === 'null' ? null : +t.dataset.sim; render(); }
});
document.addEventListener('change', e => {
  const c = e.target;
  if (c.dataset.task) { S.done[c.dataset.task] = c.checked; save(); render(); }
  if (c.dataset.bag) { S.bag[c.dataset.bag] = c.checked; save(); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'lf') { S.user = $('#em').value; go('setup'); }
  if (e.target.id === 'sf') {
    const old = S.p.zip;
    S.p = {zip:$('#zip').value, type:$('#ty').value, pets:+$('#pe').value, elderly:+$('#el').value, veh:+$('#ve').value, mob:$('#mo').checked};
    if (old !== S.p.zip) S.loc = null;
    save(); go('home'); loadLive();
  }
});
render();
if (S.p.zip && S.view !== 'login') loadLive();
</script>
</body>
</html>
